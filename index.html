
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furniture — Checkout</title>
</head>
<body>

<header class="flex flex-col items-center justify-between px-[20px] py-[20px] md:flex-row md:px-[20px] lg:px-[80px]">
    <div class="flex w-full max-w-[1280px] flex-col items-center justify-between gap-6 md:flex-row">
        <div class="text-4xl font-bold tracking-normal text-brand">FURNITURE</div>
        <nav class="flex items-center gap-6">
            <div class="flex justify-center items-center gap-[8px]">
                <div class="group w-[32px] h-[32px] rounded-full bg-blue-50 border border-gray-200 hover:bg-brand flex justify-center items-center text-brand">
                <span class="group-hover:hidden">✓</span>
                <span class="hidden group-hover:block text-white">1</span>
            </div>
            <div>Cart</div>
        </div>

        <div class="h-px w-[8px] bg-gray-200 md:w-[48px] "></div>

        <div class="flex justify-center items-center gap-[8px]">
            <div class="group w-[32px] h-[32px] rounded-full bg-blue-50 border border-gray-200 hover:bg-brand flex justify-center items-center text-brand">
                <span class="group-hover:hidden">✓</span>
                <span class="hidden group-hover:block text-white">2</span>
            </div>
            <div>Review</div>
        </div>

            <div class="h-px w-[8px] bg-gray-200 md:w-[48px] "></div>

        <div class="flex justify-center items-center bg-white gap-[8px]">
            <div class="w-[32px] h-[32px] rounded-full  bg-brand flex justify-center items-center text-white ">3</div>
            <div class="text-base  text-black">Checkout</div>
        </div>
    </nav>
    </div>
</header>

<main class="flex flex-col py-[20px] px-[20px] md:flex-row md:justify-center md:px-[80px]">

    <div class="flex flex-col">
        <div class="text-[32px] font-bold pt-[40px]">Checkout</div>
        <div class="text-xl font-bold py-[28px] ">Shipping information</div>

        <form action="" method="get">
        <div class=" flex flex-col">

            <label for="full-name" class="text-base font-medium pb-[8px] after:content-['*'] after:text-red-500">Full name</label>
            <input type="text" name="Full name" id="full-name" placeholder="Enter full name"
                   class=" w-[335px] border border-gray-200 rounded-lg py-[16px] pl-[16px] text-gray-600 mb-[24px] md:w-[672px]">


            <label for="email-address" class="text-base font-medium pb-[8px] after:content-['*'] after:text-red-500">Email-address</label>
            <input type="text" name="Email address" id="email-address" placeholder="Enter email address"
                   class=" w-[335px] border border-gray-200 rounded-lg py-[16px] pl-[16px] text-gray-600 mb-[24px] md:w-[672px]">

            <label for="phone-number" class="text-base font-medium pb-[8px] after:content-['*'] after:text-red-500">Phone number</label>
            <input type="text" name="Email address" id="phone-number" placeholder="Enter phone number"
                   class=" w-[335px] border border-gray-200 rounded-lg py-[16px] pl-[16px] text-gray-600 mb-[24px] md:w-[672px]">

            <label for="country" class="text-base font-medium pb-[8px] after:content-['*'] after:text-red-500">Country</label>
            <input type="text" name="Email address" id="country" placeholder="Enter your country"
                   class=" w-[335px] border border-gray-200 rounded-lg py-[16px] pl-[16px] text-gray-600 mb-[24px] md:w-[672px]">


            <div class="flex flex-col md:flex-row">
                <div class="flex flex-col mr-[20px]">
                    <label for="city" class="text-base font-medium pb-[8px]">City</label>
                    <input type="text" name="City" id="city" placeholder="Enter city"
                           class=" w-[335px] border border-gray-200 rounded-lg py-[16px] pl-[16px] text-gray-600 md:w-[210px]">
                </div>

                <div class="flex flex-col mr-[20px]">
                    <label for="state" class="text-base font-medium pb-[8px]">State</label>
                    <input type="text" name="State" id="state" placeholder="Enter state"
                           class=" w-[335px] border border-gray-200 rounded-lg py-[16px] pl-[16px] text-gray-600 md:w-[210px]">
                </div>

                <div class="flex flex-col">
                    <label for="zip-code" class="text-base font-medium pb-[8px]">Zip code</label>
                    <input type="text" name="State" id="zip-code" placeholder="Enter zip code"
                           class=" w-[335px] border border-gray-200 rounded-lg py-[16px] pl-[16px] text-gray-600 md:w-[210px]">
                </div>

            </div>
        </div>

        </form>
    </div>

    <div class="flex flex-col">
        <div class="flex flex-col py-[108px] md:px-[80px]">
            <div class="text-xl font-bold pb-[24px]">Review your card</div>

            <div class="flex flex-col">
                <div class="flex flex-row pb-[24px]">
                    <div class="">
                        <img class="rounded-lg border border-gray-200" src="images/image1.png" alt="image1">
                    </div>

                    <div class="flex flex-col pl-[16px]">
                        <div class="text-base font-medium pb-[6px]">DuoComfort Sofa Premium</div>
                        <div class="text-sm font-normal text-gray-500">1x</div>
                        <div class="text-base font-bold pt-[30px]">$20.00</div>
                    </div>

                </div>

                <div class="flex flex-row mb-[40px]">
                    <div class="">
                        <img class="rounded-lg border border-gray-200" src="images/image2.png" alt="image2">
                    </div>

                    <div class="flax flex-col pl-[16px]">
                        <div class="text-base font-medium pb-[6px]">IronOne Desk</div>
                        <div class="text-sm font-normal text-gray-500">1x</div>
                        <div class="text-base font-bold pt-[30px]">$25.00</div>
                    </div>

                </div>

            </div>


            <div class="flex flex-col ">
                <div class="flex items-center justify-between pb-[16px]">
                    <div class="text-sm font-normal text-gray-500">Subtotal</div>
                    <div class="text-base font-bold ">$45.00</div>
                </div>

                <div class="flex items-center justify-between pb-[16px]">
                    <div class="text-sm font-normal text-gray-500">Shipping</div>
                    <div class="text-base font-bold ">$5.00</div>
                </div>

                <div class="flex items-center justify-between pb-[16px]">
                    <div class="text-sm font-normal text-gray-500">Discount</div>
                    <div class="text-base font-bold ">-$10.00</div>
                </div>

                <div class="flex items-center justify-between pb-[40px]">
                    <div class="text-sm font-bold text-black">Total</div>
                    <div class="text-sm font-bold ">-$10.00</div>
                </div>


                <button class="w-[335px] bg-brand text-white py-[16px]  rounded-lg md:w-[528px] hover:bg-indigo-800" type="submit">Pay now</button>

            </div>

        </div>


    </div>




</main>

</body>
</html>




</body>
</html>
